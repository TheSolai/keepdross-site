products:
  - id: purr
    name: purr
    tagline: Funky ASCII TUI for local Ollama models
    description: >
      A terminal chat app that turns your local Ollama install into a multi-agent Mac assistant.
      5 built-in personas, 29 tools, dangerous-tool confirmation, streaming Markdown, multi-tab chats,
      @file attachments, yolo mode, and a hallucination detector that strikes through lies and locks the tab after 3 of them.
      Default persona: Dross (◉_◉) on gemma4:12b. No cloud. No API keys. No telemetry.
    category: tool
    language: Python
    platform: macOS 15+
    status: active
    version: v0.2.2
    license: MIT
    featured: true
    price: "from £5"
    gumroad_permalink: purr
    github: https://github.com/TheSolAI/purr
    demo: /purr/
    donate: https://monzo.me/annemarielee?d=Buy%20a%20Token%20for%20purr
    tags: [Ollama, TUI, Mac, multi-agent, Python, terminal]

  - id: terminaldeck
    name: TerminalDeck
    tagline: Native macOS dashboard for every CLI on your machine
    description: >
      A single-window dashboard for all 157 CLI tools on your Mac.
      78 installed (Claude Code, Codex, ollama, kubectl, ffmpeg…) + 83 discoverable (fzf, bat, k9s…).
      Click-to-install runs brew install live. Built-in pyte-backed tabbed terminal.
      Mac-native keyboard shortcuts: ⌘T/W/D/⇧R/1–9, ⌘F filter, ⌘, prefs. QSettings remembers everything.
    category: tool
    language: PySide6 + pyte
    platform: macOS 13+
    status: active
    version: v0.1.0
    license: MIT
    featured: true
    price: "from £5"
    gumroad_permalink: terminaldeck
    github: https://github.com/TheSolAI/terminaldeck
    demo: /terminaldeck/
    tags: [macOS, CLI, dashboard, PySide6, terminal]

